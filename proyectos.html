<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyectos · Alejandra Correa</title>
  <meta name="description" content="Proyectos de identidad, editorial, redes, fotografía y audiovisual de Alejandra Correa.">
  <meta name="theme-color" content="#683651">
  <link rel="icon" href="assets/estrella-mora.webp">
  <link rel="preload" href="assets/fuentes/dm-serif-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="proyectos">
<main>
  <section class="cabecera-pag">
    <div class="contenedor">
      <span class="eyebrow" data-anim="subir">Archivo de trabajos</span>
      <h1 class="titulo-anim">Proyectos <em>y trabajos</em></h1>
      <p class="lead" data-anim="subir" style="--d:.3s">Marcas, eventos, catálogos, reels y piezas culturales. Míralos ordenados o regados sobre mi mesa de trabajo: puedes moverlos, apilarlos y abrir el que te llame.</p>
    </div>
    <svg class="flecha" viewBox="0 0 90 70" style="right:22%;top:62%;width:110px;transform:rotate(10deg)"><path d="M6 8c26-6 56 6 64 40M58 40l12 12 10-14"/></svg>
    <img class="flor" src="assets/flor.webp" alt="" style="right:-40px;top:110px;width:240px;transform:rotate(16deg)" data-parallax=".7">
    <img class="estrella" src="assets/estrella-oro.webp" alt="" style="right:18%;top:140px;width:56px" data-parallax="1.3" data-girar=".1">
  </section>

  <section class="contenedor" style="padding-bottom:120px">
    <div class="barra-proy">
      <div class="filtros" id="filtros" role="group" aria-label="Filtrar por categoría"></div>
      <div class="vistas" role="group" aria-label="Cambiar vista">
        <button class="vista" data-v="mesa" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="9" height="9" transform="rotate(-8 7 10)"/><rect x="11" y="9" width="9" height="9" transform="rotate(9 15 13)"/></svg>Mesa</button>
        <button class="vista" data-v="lista" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>Lista</button>
      </div>
    </div>

    <div class="mesa" id="mesa" aria-label="Mesa de trabajo: arrastra los proyectos">
      <p class="mesa__pista">Arrastra las piezas · toca la flecha para abrir</p>
      <img class="mesa__deco" src="assets/flor.webp" alt="" style="right:3%;bottom:4%;width:200px;transform:rotate(-12deg);opacity:.9">
      <img class="mesa__deco" src="assets/estrella-mora.webp" alt="" style="left:38%;top:40%;width:50px;transform:rotate(18deg)">
      <svg class="mesa__deco" viewBox="0 0 40 80" fill="none" stroke="#849078" stroke-width="3" stroke-linecap="round" style="left:70%;top:46%;width:22px;transform:rotate(-30deg)"><path d="M28 22v36a10 10 0 01-20 0V14a7 7 0 0114 0v40a3.5 3.5 0 01-7 0V22"/></svg>
      <button class="estrella-oculta" data-id="proyectos" style="left:92%;top:42%"></button>
    </div>

    <div class="lista-proy" id="lista-proy" hidden></div>
  </section>
</main>
<script src="js/datos.js"></script>
<script src="js/main.js"></script>
</body>
</html>
